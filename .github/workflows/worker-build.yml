name: Worker Build

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'workers/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'workers/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-worker:
    name: Build Worker Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        worker: [notification-worker, analytics-worker, market-worker]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

